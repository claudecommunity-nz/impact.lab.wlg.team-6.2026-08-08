name: Uptime

# External heartbeat for the public demo: every 30 minutes, prove the
# health endpoint answers through the tunnel. A failed run notifies repo
# watchers, which is the alerting channel for this demo deployment.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe https://kitea.bitn.co.nz/api/health
        run: |
          out=$(curl -fsS -m 20 https://kitea.bitn.co.nz/api/health)
          echo "$out"
          echo "$out" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['ok'] is True, d"

      - name: Raise an alert issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Uptime probe failed: kitea.bitn.co.nz $(date -u +%FT%TZ)" \
            --body "The scheduled health probe failed. Runbook: docs/RUNBOOK.md (incidents section). Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" || true
